name: Deploy Documentation

on:
  push:
    branches: [main] # Déclenchement automatique sur la branche principale
  workflow_dispatch: # Permet un lancement manuel depuis l'onglet Actions

permissions:
  contents: read
  pages: write # Requis pour publier sur GitHub Pages
  id-token: write # Requis pour l'authentification sécurisée

# Évite de lancer plusieurs déploiements en même temps
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20 # Version stable recommandée
          cache: 'npm'

      - name: 🛠️ Install dependencies
        run: npm ci

      - name: 🏗️ Build website
        run: npm run build

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./build # Dossier généré par Docusaurus

  deploy:
    name: Push to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🚀 Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4